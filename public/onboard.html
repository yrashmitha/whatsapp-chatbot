<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Onboarding</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: #075e54;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar h1 { font-size: 17px; font-weight: 700; }
    .topbar a  { color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; }
    .topbar a:hover { color: #fff; }

    /* ── Layout ── */
    .layout {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
      gap: 24px;
    }

    /* ── Client list sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
    }
    .sidebar-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .sidebar-hdr {
      background: #075e54;
      color: #fff;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-new {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-new:hover { background: rgba(255,255,255,0.35); }
    .client-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
    }
    .client-item:hover { background: #f5f5f5; }
    .client-item.active { background: #e8f5e9; border-left: 3px solid #075e54; }
    .client-item .ci-name { font-size: 13px; font-weight: 600; }
    .client-item .ci-id   { font-size: 11px; color: #888; margin-top: 2px; }
    .client-item .ci-type { font-size: 10px; color: #fff; background: #128c7e; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-top: 3px; }

    /* ── Main form ── */
    .main { flex: 1; min-width: 0; }
    .form-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 24px;
    }
    .form-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: #075e54;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    /* ── Section headers ── */
    .section-hdr {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin: 20px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f0f0f0;
    }
    .section-hdr:first-of-type { margin-top: 0; }

    /* ── Form fields ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
    }
    .field label .req { color: #e53935; }
    .field input, .field textarea, .field select {
      padding: 9px 11px;
      border: 1px solid #d0d0d0;
      border-radius: 7px;
      font-size: 13px;
      color: #222;
      transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none;
      border-color: #075e54;
    }
    .field textarea { min-height: 100px; resize: vertical; font-family: inherit; }
    .field .hint { font-size: 11px; color: #999; }

    /* ── Color picker row ── */
    .color-row { display: flex; gap: 8px; align-items: center; }
    .color-row input[type=color] {
      width: 40px; height: 36px;
      padding: 2px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .color-row input[type=text] { flex: 1; }

    /* ── Toggle row ── */
    .toggle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f9f9f9;
      border-radius: 7px;
      border: 1px solid #eee;
    }
    .toggle-item label { font-size: 13px; font-weight: 500; flex: 1; cursor: pointer; }
    .toggle-item input[type=checkbox] {
      width: 16px; height: 16px; accent-color: #075e54; cursor: pointer;
    }

    /* ── Action bar ── */
    .action-bar {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .btn-save {
      background: #075e54;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save:hover { background: #128c7e; }
    .btn-save:disabled { background: #aaa; cursor: default; }
    .btn-cancel {
      background: #fff;
      color: #555;
      border: 1px solid #ccc;
      padding: 10px 20px;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-cancel:hover { background: #f5f5f5; }
    .btn-deactivate {
      background: #fff;
      color: #c62828;
      border: 1px solid #ef9a9a;
      padding: 10px 16px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      margin-left: auto;
    }
    .btn-deactivate:hover { background: #ffebee; }

    /* ── Links section ── */
    .links-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 16px 20px;
      margin-top: 16px;
      display: none;
    }
    .links-card h3 { font-size: 13px; font-weight: 700; color: #075e54; margin-bottom: 12px; }
    .link-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .link-row label { font-size: 12px; color: #888; min-width: 90px; }
    .link-row a {
      font-size: 12px;
      color: #075e54;
      word-break: break-all;
      flex: 1;
    }
    .link-row .copy-btn {
      background: #f0f0f0;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #323232;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: #aaa; }
    .empty .icon { font-size: 40px; margin-bottom: 10px; }
    .empty p { font-size: 14px; }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .form-grid, .toggle-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>⚙️ Client Onboarding</h1>
  <a href="/admin.html">← Back to Admin</a>
</div>

<div class="layout">
  <!-- Sidebar: client list -->
  <div class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-hdr">
        <span>Clients</span>
        <button class="btn-new" onclick="newClient()">+ New</button>
      </div>
      <div id="clientList">
        <div class="empty"><div class="icon">⏳</div><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <!-- Main: form -->
  <div class="main">
    <div class="form-card" id="formCard">
      <div class="empty">
        <div class="icon">👈</div>
        <p>Select a client to edit, or click <strong>+ New</strong> to onboard a new one.</p>
      </div>
    </div>

    <!-- Quick links (shown after save) -->
    <div class="links-card" id="linksCard">
      <h3>🔗 Quick Links</h3>
      <div class="link-row">
        <label>Manage Products</label>
        <a id="lnkProducts" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyLink('lnkProducts')">Copy</button>
      </div>
      <div class="link-row">
        <label>Catalog Page</label>
        <a id="lnkCatalog" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyLink('lnkCatalog')">Copy</button>
      </div>
      <div class="link-row">
        <label>Admin Panel</label>
        <a id="lnkAdmin" href="/admin.html" target="_blank">/admin.html</a>
        <button class="copy-btn" onclick="copyLink('lnkAdmin')">Copy</button>
      </div>
      <div class="link-row">
        <label>Webhook URL</label>
        <a id="lnkWebhook" href="#"></a>
        <button class="copy-btn" onclick="copyLink('lnkWebhook')">Copy</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Auth ────────────────────────────────────────────────────────────────────
  let PASS = localStorage.getItem('admin_pass') || '';
  if (!PASS) {
    PASS = prompt('Admin password:') || '';
    if (PASS) localStorage.setItem('admin_pass', PASS);
  }

  async function apiFetch(path, opts = {}) {
    const url = `${path}${path.includes('?') ? '&' : '?'}pass=${encodeURIComponent(PASS)}`;
    const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 401) {
      localStorage.removeItem('admin_pass');
      alert('Wrong password');
      throw new Error('Unauthorized');
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function toast(msg, duration = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), duration);
  }

  // ── State ───────────────────────────────────────────────────────────────────
  let clients    = [];
  let activeId   = null;
  let isNew      = false;
  const BASE_URL = location.origin;

  // ── Load clients ────────────────────────────────────────────────────────────
  async function loadClients() {
    try {
      clients = await apiFetch('/admin/clients');
      renderClientList();
    } catch (e) {
      if (e.message !== 'Unauthorized') toast('Failed to load clients');
    }
  }

  function renderClientList() {
    const el = document.getElementById('clientList');
    if (!clients.length) {
      el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No clients yet. Click + New.</p></div>';
      return;
    }
    el.innerHTML = clients.map(c => `
      <div class="client-item ${c.id === activeId ? 'active' : ''}" onclick="selectClient('${c.id}')">
        <div class="ci-name">${c.brand_name || c.name || c.id}</div>
        <div class="ci-id">${c.id}</div>
        <span class="ci-type">${c.type || 'general'}</span>
        ${!c.active ? '<span style="font-size:10px;color:#e53935;margin-left:4px;">⛔ inactive</span>' : ''}
      </div>`).join('');
  }

  // ── Select client ───────────────────────────────────────────────────────────
  async function selectClient(id) {
    activeId = id;
    isNew    = false;
    renderClientList();
    try {
      const client = await apiFetch(`/admin/clients/${encodeURIComponent(id)}`);
      renderForm(client);
      showLinks(id);
    } catch (e) {
      if (e.message !== 'Unauthorized') toast('Failed to load client: ' + e.message);
    }
  }

  // ── New client ──────────────────────────────────────────────────────────────
  function newClient() {
    activeId = null;
    isNew    = true;
    renderClientList();
    renderForm(null);
    document.getElementById('linksCard').style.display = 'none';
  }

  // ── Show links ──────────────────────────────────────────────────────────────
  function showLinks(clientId) {
    const card     = document.getElementById('linksCard');
    const products = `${BASE_URL}/products.html?client=${clientId}`;
    const catalog  = `${BASE_URL}/catalog.html?client=${clientId}`;
    const webhook  = `${BASE_URL}/webhook`;
    document.getElementById('lnkProducts').href        = products;
    document.getElementById('lnkProducts').textContent = products;
    document.getElementById('lnkCatalog').href         = catalog;
    document.getElementById('lnkCatalog').textContent  = catalog;
    document.getElementById('lnkWebhook').href         = webhook;
    document.getElementById('lnkWebhook').textContent  = webhook;
    card.style.display = '';
  }

  function copyLink(elId) {
    const text = document.getElementById(elId).href || document.getElementById(elId).textContent;
    navigator.clipboard.writeText(text).then(() => toast('Copied ✓'));
  }

  // ── Render form ─────────────────────────────────────────────────────────────
  function renderForm(c) {
    const isEdit  = !!c;
    const title   = isEdit ? `Edit: ${c.brand_name || c.name || c.id}` : 'New Client';

    document.getElementById('formCard').innerHTML = `
      <h2>${title}</h2>

      <div class="section-hdr">Identity</div>
      <div class="form-grid">
        <div class="field">
          <label>Client ID <span class="req">*</span></label>
          <input id="fId" value="${c?.id || ''}" placeholder="e.g. shop_001" ${isEdit ? 'readonly style="background:#f5f5f5;color:#888"' : ''}>
          <span class="hint">Lowercase, no spaces. Cannot change after creation.</span>
        </div>
        <div class="field">
          <label>Business Name <span class="req">*</span></label>
          <input id="fName" value="${c?.name || ''}" placeholder="e.g. My Clothing Store">
        </div>
        <div class="field">
          <label>Business Type</label>
          <select id="fType">
            <option value="general"    ${(c?.type||'general')==='general'    ? 'selected':''}>General</option>
            <option value="ecommerce"  ${c?.type==='ecommerce'  ? 'selected':''}>E-commerce</option>
            <option value="restaurant" ${c?.type==='restaurant' ? 'selected':''}>Restaurant</option>
            <option value="astrology"  ${c?.type==='astrology'  ? 'selected':''}>Astrology</option>
            <option value="service"    ${c?.type==='service'    ? 'selected':''}>Service</option>
          </select>
        </div>
        <div class="field">
          <label>Order ID Prefix</label>
          <input id="fPrefix" value="${c?.order_id_prefix || ''}" placeholder="e.g. SHOP (unique, uppercase)">
          <span class="hint">Generates SHOP2026-0001. Must be unique across all clients.</span>
        </div>
      </div>

      <div class="section-hdr">WhatsApp Credentials</div>
      <div class="form-grid">
        <div class="field">
          <label>Phone Number ID</label>
          <input id="fPhoneId" value="${c?.phone_number_id || ''}" placeholder="Meta phone_number_id">
          <span class="hint">From Meta Business → WhatsApp → API Setup.</span>
        </div>
        <div class="field">
          <label>WA Token Env Var Name</label>
          <input id="fWaTokenEnv" value="${c?.wa_token_env || ''}" placeholder="e.g. SHOP001_WA_TOKEN">
          <span class="hint">Add this env var in Railway with the actual token value.</span>
        </div>
      </div>

      <div class="section-hdr">AI Settings</div>
      <div class="form-grid">
        <div class="field">
          <label>AI Model</label>
          <select id="fModel">
            <option value="gemini-2.5-flash" ${(c?.ai_model||'gemini-2.5-flash')==='gemini-2.5-flash'?'selected':''}>gemini-2.5-flash</option>
            <option value="gemini-2.0-flash" ${c?.ai_model==='gemini-2.0-flash'?'selected':''}>gemini-2.0-flash</option>
            <option value="gemini-1.5-pro"   ${c?.ai_model==='gemini-1.5-pro'  ?'selected':''}>gemini-1.5-pro</option>
          </select>
        </div>
        <div class="field">
          <label>Temperature (0.0 – 1.0)</label>
          <input id="fTemp" type="number" step="0.1" min="0" max="1" value="${c?.temperature ?? 0.7}">
        </div>
        <div class="field">
          <label>System Prompt Mode</label>
          <select id="fPromptMode" onchange="togglePromptField()">
            <option value="custom"  ${(c?.system_prompt_mode||'custom')==='custom'  ?'selected':''}>Custom (enter below)</option>
            <option value="builtin" ${c?.system_prompt_mode==='builtin'?'selected':''}>Built-in (astrology)</option>
          </select>
        </div>
        <div class="field full" id="customPromptField" style="${(c?.system_prompt_mode||'custom')!=='custom'?'display:none':''}">
          <label>System Prompt / AI Instructions</label>
          <textarea id="fPrompt" placeholder="You are a helpful assistant for [Business Name]. You help customers...">${c?.custom_prompt || ''}</textarea>
          <span class="hint">Describe the AI's persona, what it sells, how it should respond, language rules, etc.</span>
        </div>
      </div>

      <div class="section-hdr">Branding</div>
      <div class="form-grid">
        <div class="field">
          <label>Brand Display Name</label>
          <input id="fBrandName" value="${c?.brand_name || c?.name || ''}" placeholder="Shown in catalog page header">
        </div>
        <div class="field">
          <label>Brand Color</label>
          <div class="color-row">
            <input type="color" id="fColorPicker" value="${c?.brand_color || '#075e54'}" oninput="document.getElementById('fColor').value=this.value">
            <input type="text"  id="fColor" value="${c?.brand_color || '#075e54'}" placeholder="#075e54" oninput="syncColor()">
          </div>
        </div>
        <div class="field full">
          <label>Logo URL</label>
          <input id="fLogo" value="${c?.logo_url || ''}" placeholder="https://... (optional, shown in catalog)">
        </div>
      </div>

      <div class="section-hdr">Features</div>
      <div class="toggle-grid">
        <div class="toggle-item">
          <input type="checkbox" id="fCatalog" ${c?.product_catalog_enabled ? 'checked' : ''}>
          <label for="fCatalog">📦 Product Catalog enabled</label>
        </div>
        <div class="toggle-item">
          <input type="checkbox" id="fOrderFlow" ${c?.order_flow_enabled !== false ? 'checked' : ''}>
          <label for="fOrderFlow">🛒 Order Flow enabled</label>
        </div>
      </div>

      <div class="section-hdr">Admin</div>
      <div class="form-grid">
        <div class="field">
          <label>Admin Password Env Var</label>
          <input id="fAdminEnv" value="${c?.admin_password_env || 'ADMIN_PASSWORD'}" placeholder="ADMIN_PASSWORD">
          <span class="hint">Env var name holding the admin panel password.</span>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-save" id="saveBtn" onclick="saveClient()">
          ${isEdit ? '💾 Save Changes' : '🚀 Create Client'}
        </button>
        <button class="btn-cancel" onclick="newClient()">Cancel</button>
        ${isEdit ? `<button class="btn-deactivate" onclick="toggleActive('${c.id}', ${!c.active})">
          ${c.active ? '⛔ Deactivate' : '✅ Activate'}
        </button>` : ''}
      </div>
    `;
  }

  function togglePromptField() {
    const mode = document.getElementById('fPromptMode').value;
    document.getElementById('customPromptField').style.display = mode === 'custom' ? '' : 'none';
  }

  function syncColor() {
    const val = document.getElementById('fColor').value;
    if (/^#[0-9a-fA-F]{6}$/.test(val)) {
      document.getElementById('fColorPicker').value = val;
    }
  }

  // ── Save ─────────────────────────────────────────────────────────────────────
  async function saveClient() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const body = {
      id:                     document.getElementById('fId').value.trim(),
      name:                   document.getElementById('fName').value.trim(),
      type:                   document.getElementById('fType').value,
      phone_number_id:        document.getElementById('fPhoneId').value.trim() || null,
      wa_token_env:           document.getElementById('fWaTokenEnv').value.trim() || null,
      ai_model:               document.getElementById('fModel').value,
      system_prompt_mode:     document.getElementById('fPromptMode').value,
      custom_prompt:          document.getElementById('fPrompt')?.value.trim() || null,
      temperature:            parseFloat(document.getElementById('fTemp').value) || 0.7,
      brand_name:             document.getElementById('fBrandName').value.trim() || null,
      brand_color:            document.getElementById('fColor').value.trim() || '#075e54',
      logo_url:               document.getElementById('fLogo').value.trim() || null,
      order_id_prefix:        document.getElementById('fPrefix').value.trim().toUpperCase() || null,
      product_catalog_enabled: document.getElementById('fCatalog').checked,
      order_flow_enabled:     document.getElementById('fOrderFlow').checked,
      admin_password_env:     document.getElementById('fAdminEnv').value.trim() || 'ADMIN_PASSWORD',
    };

    if (!body.name) { toast('Business Name is required'); btn.disabled = false; btn.textContent = isNew ? '🚀 Create Client' : '💾 Save Changes'; return; }
    if (isNew && !body.id) { toast('Client ID is required'); btn.disabled = false; btn.textContent = '🚀 Create Client'; return; }

    try {
      if (isNew) {
        await apiFetch('/admin/clients', { method: 'POST', body: JSON.stringify(body) });
        toast('Client created ✓');
        activeId = body.id;
        isNew    = false;
      } else {
        await apiFetch(`/admin/clients/${encodeURIComponent(activeId)}`, { method: 'PUT', body: JSON.stringify(body) });
        toast('Client updated ✓');
      }
      await loadClients();
      const client = await apiFetch(`/admin/clients/${encodeURIComponent(activeId)}`);
      renderForm(client);
      showLinks(activeId);
    } catch (err) {
      toast('Error: ' + err.message);
      btn.disabled = false;
      btn.textContent = isNew ? '🚀 Create Client' : '💾 Save Changes';
    }
  }

  async function toggleActive(clientId, newActive) {
    try {
      await apiFetch(`/admin/clients/${encodeURIComponent(clientId)}`, {
        method: 'PUT',
        body: JSON.stringify({ active: newActive }),
      });
      toast(newActive ? 'Client activated ✓' : 'Client deactivated ✓');
      await loadClients();
      await selectClient(clientId);
    } catch (err) {
      toast('Error: ' + err.message);
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  loadClients();
</script>
</body>
</html>
