[phases.setup]
# ffmpeg converts recorded audio to Ogg/Opus, the only thing WhatsApp shows
# as a real voice note rather than a file attachment.
nixPkgs = ["nodejs_22", "libreoffice", "fontconfig", "ffmpeg"]

[phases.install]
cmds = ["npm install", "npm install --prefix frontend"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node backend/index.js"
